# .github/workflows/scraper.yaml
name: Scheduled Wallpaper Scraper

on:
  # Schedule to run twice a day (every 12 hours) in UTC time.
  schedule:
    - cron: '0 10,22 * * *'
  
  # Allows manual running of the workflow from the Actions tab
  workflow_dispatch:

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the repository code
      # Give the default GITHUB_TOKEN write permission for the commit action
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # 3. Install necessary dependencies
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml
          
      # 4. Run the Python scraping script
      # 'continue-on-error: true' ensures the workflow continues even if the scraper fails.
      - name: Run Scraper
        id: scraper_run
        run: python scraper.py
        continue-on-error: true 
        
      # 5. Commit the new images to the repository (FIXED ACTION)
      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # This action requires the list of files/directories to be in the 'files' parameter
          files: 'reallybig/4uffin/images/scraped' 
          # Use 'commit_message' instead of 'message'
          commit_message: |
            ${{ steps.scraper_run.outcome == 'success' && '🤖 Automated scrape: New wallpapers added.' || '⚠️ Automated scrape: Scraper FAILED, attempting to commit existing files.' }}
          # The token is passed automatically by default, but it's good practice to ensure permissions are set
